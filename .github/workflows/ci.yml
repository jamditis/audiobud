# AudioBud CI (milestone A): fast correctness checks on every push/PR - lint,
# formatting, types, and unit tests (frontend) plus cargo test against a mock
# transcription backend (no GPU). Native packaging/bundling and the signed
# release + updater pipeline are deliberately milestone B: they need AudioBud's
# own signing identity and provenance, not the inherited cjpais/Handy config.
# See superpowers/DEFERRED-issues.md ("Milestone B" section).
#
# The two Rust jobs below mock the transcription engine to stay fast. That is a
# deliberate trade, not full coverage: engine.yml builds the real engine on
# Windows whenever src-tauri changes, so the code these jobs skip is still
# compiled and tested before it can reach a release (issue #146).
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MODEL_ASSET_BASE_URL: https://github.com/jamditis/audiobud/releases/download/model-assets-v1
  SILERO_VAD_BYTES: 1807522
  SILERO_VAD_SHA256: a35ebf52fd3ce5f1469b2a36158dba761bc47b973ea3382b3186ca15b1f5af28

jobs:
  frontend:
    name: Frontend (lint, format, types, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Keep this an exact semver. setup-bun builds the download URL directly
      # only for strict x.y.z; "latest", a range, or an empty value resolve the
      # tag through an authenticated api.github.com call, which makes this job
      # fail whenever GitHub's REST API is degraded.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Check rebrand invariants
        run: bun run check:rebrand

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify published model mirror
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/verify-model-assets.ts

      # Every locale must carry the full en key set, and user-facing values that
      # still match English after Unicode compatibility, case, and whitespace
      # normalization fail unless their path, source, and locale scope have a
      # reviewed exception.
      - name: Check translation consistency
        run: bun run check:translations

      - name: Lint
        run: bun run lint

      - name: Prettier + cargo fmt check
        run: bun run format:check

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Unit tests
        run: bun run test

  rust-tests:
    name: Rust tests (mock transcription, no GPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        timeout-minutes: 8
        run: |
          # DEBIAN_FRONTEND must ride inside sudo (env_reset strips a step-level
          # env: before apt/dpkg ever see it), so set it as a sudo argument.
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Acquire::Retries=3 libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libssl-dev libgtk-layer-shell-dev

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Use mock TranscriptionManager (CI only)
        working-directory: src-tauri
        run: |
          # Swap to the mock adapter so cargo test does not compile whisper/Vulkan/ONNX.
          # The real transcription.rs is compiled and tested by engine.yml.
          cp src/managers/transcription_mock.rs src/managers/transcription.rs
          sed -i '/^transcribe-rs/d' Cargo.toml

      - name: Download the VAD model (unicode-path ONNX regression test)
        working-directory: src-tauri
        run: |
          # silero_vad_loads_from_unicode_directory fails in CI when the model
          # is absent instead of skipping silently, so keep this step ahead of
          # cargo test.
          mkdir -p resources/models
          model="resources/models/silero_vad_v4.onnx"
          curl --fail --location --retry 3 -o "$model" "$MODEL_ASSET_BASE_URL/silero_vad_v4.onnx"
          test "$(wc -c < "$model")" -eq "$SILERO_VAD_BYTES"
          echo "$SILERO_VAD_SHA256  $model" | sha256sum -c -

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

  rust-tests-windows:
    name: Rust tests (Windows, mock transcription, no GPU)
    # The unicode/surrogate path regression tests (issue #56) are
    # cfg(windows)-gated: unpaired-surrogate names and the reported profile
    # paths only exist there. Without this job they never run in CI.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Parse updater candidate verifier
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/verify-updater-candidate.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            throw 'Updater candidate verifier has PowerShell parse errors'
          }

      # Compile a tiny installer with the same NSIS ExecWait shape as the real
      # portable installer. This catches quoting/serialization regressions
      # without rebuilding the hour-long signed release. The archive and SHA-1
      # are the exact NSIS toolchain pinned by Tauri CLI 2.10.0.
      - name: Verify fixed-runtime AppContainer ACL command
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP `
            "audiobud-webview-acl-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $workspace | Out-Null
          $nsisArchive = Join-Path $workspace "nsis-3.11.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip" `
            -OutFile $nsisArchive
          $expectedSha1 = "EF7FF767E5CBD9EDD22ADD3A32C9B8F4500BB10D"
          $actualSha1 = (Get-FileHash -LiteralPath $nsisArchive -Algorithm SHA1).Hash
          if ($actualSha1 -ne $expectedSha1) {
            throw "NSIS archive SHA-1 mismatch: $actualSha1"
          }
          Expand-Archive -LiteralPath $nsisArchive -DestinationPath $workspace
          $makensis = Join-Path $workspace "nsis-3.11\makensis.exe"

          $probeScript = Join-Path $workspace "acl-probe.nsi"
          @'
          Unicode true
          SilentInstall silent
          RequestExecutionLevel user
          OutFile "acl-probe.exe"

          Section
            CreateDirectory "$INSTDIR"
            FileOpen $9 "$INSTDIR\probe-exits.txt" w

            CreateDirectory "$INSTDIR\quoted"
            FileOpen $8 "$INSTDIR\quoted\msedgewebview2.exe" w
            FileClose $8
            ExecWait '"$SYSDIR\icacls.exe" "$INSTDIR\quoted" /grant "*S-1-15-2-2:(OI)(CI)(RX)"' $0
            FileWrite $9 "quoted-all=$0$\r$\n"
            ExecWait '"$SYSDIR\icacls.exe" "$INSTDIR\quoted" /grant "*S-1-15-2-1:(OI)(CI)(RX)"' $0
            FileWrite $9 "quoted-restricted=$0$\r$\n"

            CreateDirectory "$INSTDIR\unquoted"
            FileOpen $8 "$INSTDIR\unquoted\msedgewebview2.exe" w
            FileClose $8
            ExecWait '"$SYSDIR\icacls.exe" "$INSTDIR\unquoted" /grant *S-1-15-2-2:(OI)(CI)(RX)' $0
            FileWrite $9 "unquoted-all=$0$\r$\n"
            ExecWait '"$SYSDIR\icacls.exe" "$INSTDIR\unquoted" /grant *S-1-15-2-1:(OI)(CI)(RX)' $0
            FileWrite $9 "unquoted-restricted=$0$\r$\n"

            FileClose $9
          SectionEnd
          '@ | Set-Content -LiteralPath $probeScript -Encoding utf8

          Push-Location $workspace
          try {
            & $makensis /V4 $probeScript
            if ($LASTEXITCODE -ne 0) {
              throw "makensis failed with exit code $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }

          $probeRoot = Join-Path $workspace "installed"
          $probe = Start-Process -FilePath (Join-Path $workspace "acl-probe.exe") `
            -ArgumentList @("/S", "/D=$probeRoot") -Wait -PassThru
          if ($probe.ExitCode -ne 0) {
            throw "NSIS ACL probe failed with exit code $($probe.ExitCode)"
          }
          Get-Content -LiteralPath (Join-Path $probeRoot "probe-exits.txt")

          # Keep a direct PowerShell invocation as a control for the runner's
          # icacls behavior, independent of NSIS command-line serialization.
          $directDirectory = Join-Path $probeRoot "direct"
          New-Item -ItemType Directory -Path $directDirectory | Out-Null
          New-Item -ItemType File `
            -Path (Join-Path $directDirectory "msedgewebview2.exe") | Out-Null
          foreach ($grant in @(
              "*S-1-15-2-2:(OI)(CI)(RX)",
              "*S-1-15-2-1:(OI)(CI)(RX)")) {
            & "$env:SystemRoot\System32\icacls.exe" $directDirectory /grant $grant
            if ($LASTEXITCODE -ne 0) {
              throw "Direct icacls control failed for $grant with exit code $LASTEXITCODE"
            }
          }

          function Get-NumericAclRules {
            param([string] $Path, [string] $Label)

            $acl = Get-Acl -LiteralPath $Path
            Write-Host "[$Label] icacls output:"
            & "$env:SystemRoot\System32\icacls.exe" $Path | Out-Host
            Write-Host "[$Label] SDDL: $($acl.GetSecurityDescriptorSddlForm(
              [System.Security.AccessControl.AccessControlSections]::Access))"
            $rules = @($acl.GetAccessRules(
              $true,
              $true,
              [System.Security.Principal.SecurityIdentifier]))
            $rules | Format-Table IdentityReference, FileSystemRights, `
              InheritanceFlags, PropagationFlags, AccessControlType, IsInherited `
              -AutoSize | Out-String | Write-Host
            return $rules
          }

          function Test-AllowReadAndExecuteAcl {
            param(
              [object[]] $Rules,
              [string] $Sid,
              [bool] $RequireDirectoryInheritance,
              [bool] $RequireInherited
            )

            $requiredRights = [System.Security.AccessControl.FileSystemRights]::ReadAndExecute
            $requiredInheritance = `
              [System.Security.AccessControl.InheritanceFlags]::ObjectInherit -bor `
              [System.Security.AccessControl.InheritanceFlags]::ContainerInherit
            foreach ($rule in $Rules) {
              $hasRights = `
                ($rule.FileSystemRights -band $requiredRights) -eq $requiredRights
              $hasInheritance = `
                (-not $RequireDirectoryInheritance) -or `
                (($rule.InheritanceFlags -band $requiredInheritance) -eq $requiredInheritance)
              $isInherited = (-not $RequireInherited) -or $rule.IsInherited
              if ($rule.IdentityReference.Value -eq $Sid -and
                  $rule.AccessControlType -eq [System.Security.AccessControl.AccessControlType]::Allow -and
                  $hasRights -and $hasInheritance -and $isInherited) {
                return $true
              }
            }
            return $false
          }

          $requiredSids = @("S-1-15-2-2", "S-1-15-2-1")
          foreach ($variant in @("quoted", "unquoted", "direct")) {
            $directory = Join-Path $probeRoot $variant
            $browser = Join-Path $directory "msedgewebview2.exe"
            $directoryRules = @(Get-NumericAclRules -Path $directory -Label "$variant directory")
            $browserRules = @(Get-NumericAclRules -Path $browser -Label "$variant browser")

            # The unquoted form is the production command; the direct variant
            # is its control. The old quoted form remains diagnostic so the log
            # records whether argument quoting caused the original failure.
            if ($variant -eq "quoted") { continue }
            foreach ($sid in $requiredSids) {
              if (-not (Test-AllowReadAndExecuteAcl `
                  -Rules $directoryRules -Sid $sid `
                  -RequireDirectoryInheritance $true -RequireInherited $false)) {
                throw "Required $variant directory ACL is missing: $sid"
              }
              if (-not (Test-AllowReadAndExecuteAcl `
                  -Rules $browserRules -Sid $sid `
                  -RequireDirectoryInheritance $false -RequireInherited $true)) {
                throw "Required $variant inherited browser ACL is missing: $sid"
              }
            }
          }

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Use mock TranscriptionManager (CI only)
        working-directory: src-tauri
        shell: bash
        run: |
          # Swap to the mock adapter so cargo test does not compile whisper/Vulkan/ONNX.
          # The real transcription.rs is compiled and tested by engine.yml.
          cp src/managers/transcription_mock.rs src/managers/transcription.rs
          sed -i '/^transcribe-rs/d' Cargo.toml

      - name: Download the VAD model (unicode-path ONNX regression test)
        working-directory: src-tauri
        shell: bash
        run: |
          mkdir -p resources/models
          model="resources/models/silero_vad_v4.onnx"
          curl --fail --location --retry 3 -o "$model" "$MODEL_ASSET_BASE_URL/silero_vad_v4.onnx"
          test "$(wc -c < "$model")" -eq "$SILERO_VAD_BYTES"
          echo "$SILERO_VAD_SHA256  $model" | sha256sum -c -

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # gitleaks-action lists the PR's commits to scope its scan, which needs
    # pull-requests: read; the default GITHUB_TOKEN does not grant it. Keep the
    # token read-only and turn off PR comments so it never needs write access.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
