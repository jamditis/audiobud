# Temporary operator diagnostic. Do not merge this workflow into main.
# It reads the pinned private candidate and runs its existing verification script.
# It has no build, signing, release upload, publication or feed-promotion step.
# Diagnostic evidence is not valid protected-release evidence.
name: Diagnose private updater candidate

on:
  workflow_dispatch:

concurrency:
  group: updater-diagnostic-v0.6.3
  cancel-in-progress: false

env:
  TARGET_COMMIT: 149caae5df9a1ac998e2080af3cfb93a74e5bf98

jobs:
  diagnose-updater-candidate:
    name: Diagnose the private Windows updater candidate
    runs-on: windows-2025
    timeout-minutes: 15
    outputs:
      artifact-name: ${{ steps.updater-meta.outputs.evidence_artifact }}
    permissions:
      attestations: read
      # GitHub limits draft release visibility to identities with push access.
      # This job only reads and verifies the protected draft.
      contents: write
    steps:
      - name: Check out repository for updater verification
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 149caae5df9a1ac998e2080af3cfb93a74e5bf98
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun for updater verification
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install Rust for updater verification
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Resolve private updater draft
        id: updater-meta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.6.3
        run: |
          $config = Get-Content -LiteralPath 'src-tauri/tauri.conf.json' -Raw |
            ConvertFrom-Json
          $version = [string]$config.version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Application version is not stable semver: $version"
          }
          if ($env:RELEASE_TAG -cne "v$version") {
            throw "Release tag $env:RELEASE_TAG does not match application version $version"
          }

          $tagCommit = git rev-list -n 1 "refs/tags/$env:RELEASE_TAG" 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $tagCommit) {
            throw "Release tag $env:RELEASE_TAG was not checked out"
          }
          if ($tagCommit -cne $env:TARGET_COMMIT) {
            throw "Release tag $env:RELEASE_TAG points to $tagCommit, not $env:TARGET_COMMIT"
          }

          # The release-by-tag REST endpoint only returns published releases.
          $releaseApiUrl = gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY --json apiUrl --jq '.apiUrl'
          if ($LASTEXITCODE -ne 0 -or -not $releaseApiUrl) {
            throw "Draft release $env:RELEASE_TAG was not found"
          }
          $releaseJson = gh api $releaseApiUrl
          if ($LASTEXITCODE -ne 0) {
            throw "Draft release $env:RELEASE_TAG could not be read"
          }
          $release = $releaseJson | ConvertFrom-Json
          if (-not $release.draft) {
            throw "Release $env:RELEASE_TAG is not a draft"
          }
          if ($release.prerelease) {
            throw "Release $env:RELEASE_TAG is marked as a prerelease"
          }
          if ($null -ne $release.published_at) {
            throw "Release $env:RELEASE_TAG already has a publication time"
          }
          if ([string]$release.tag_name -cne $env:RELEASE_TAG) {
            throw "Draft release returned the wrong tag: $($release.tag_name)"
          }

          $releasePagesJson = gh api --paginate --slurp `
            "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) {
            throw 'Published releases could not be listed'
          }
          $priorTag = $releasePagesJson |
            node scripts/select-latest-stable-app-release.mjs
          if ($LASTEXITCODE -ne 0 -or -not $priorTag) {
            throw 'Latest prior stable app release was not found'
          }
          $priorTag = $priorTag.Trim()
          $priorVersion = $priorTag.Substring(1)
          if ([version]$priorVersion -ge [version]$version) {
            throw "Prior release $priorTag is not older than $env:RELEASE_TAG"
          }

          "version=$version" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$env:RELEASE_TAG" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prior_tag=$priorTag" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prior_version=$priorVersion" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "evidence_artifact=audiobud-updater-diagnostic-$env:RELEASE_TAG-$env:GITHUB_RUN_ATTEMPT" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Download private updater draft files
        id: updater-files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.updater-meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.updater-meta.outputs.version }}
        run: |
          $assetDirectory = Join-Path $env:RUNNER_TEMP `
            "audiobud-private-updater-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $assetDirectory) {
            throw "Private updater directory already exists: $assetDirectory"
          }
          New-Item -ItemType Directory -Path $assetDirectory | Out-Null

          $archiveName = "AudioBud_$($env:RELEASE_VERSION)_x64-setup.nsis.zip"
          $signatureName = "$archiveName.sig"
          $publicKeyName = 'updater-signing-public-key.pub'
          foreach ($assetName in @($archiveName, $signatureName, $publicKeyName)) {
            gh release download $env:RELEASE_TAG `
              --dir $assetDirectory `
              --pattern $assetName
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to download private draft asset $assetName"
            }
          }

          $files = @(Get-ChildItem -LiteralPath $assetDirectory -File)
          if ($files.Count -ne 3) {
            throw "Expected three private updater files, found $($files.Count)"
          }
          $archive = Join-Path $assetDirectory $archiveName
          $signature = Join-Path $assetDirectory $signatureName
          $publicKey = Join-Path $assetDirectory $publicKeyName
          foreach ($path in @($archive, $signature, $publicKey)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Private updater asset was not downloaded: $path"
            }
            if ((Get-Item -LiteralPath $path).Length -le 0) {
              throw "Private updater asset is empty: $path"
            }
          }

          "archive=$archive" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "signature=$signature" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "public_key=$publicKey" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify private updater provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.updater-meta.outputs.tag }}
          UPDATER_ARCHIVE: ${{ steps.updater-files.outputs.archive }}
          UPDATER_SIGNATURE: ${{ steps.updater-files.outputs.signature }}
          UPDATER_PUBLIC_KEY: ${{ steps.updater-files.outputs.public_key }}
        run: |
          foreach ($path in @(
            $env:UPDATER_ARCHIVE,
            $env:UPDATER_SIGNATURE,
            $env:UPDATER_PUBLIC_KEY
          )) {
            gh attestation verify $path `
              --repo $env:GITHUB_REPOSITORY `
              --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/release.yml" `
              --source-ref "refs/tags/$env:RELEASE_TAG" `
              --source-digest $env:TARGET_COMMIT `
              --deny-self-hosted-runners
            if ($LASTEXITCODE -ne 0) {
              throw "Release provenance verification failed: $path"
            }
          }

      - name: Verify private updater signature
        shell: pwsh
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          UPDATER_ARCHIVE: ${{ steps.updater-files.outputs.archive }}
          UPDATER_SIGNATURE: ${{ steps.updater-files.outputs.signature }}
          UPDATER_PUBLIC_KEY: ${{ steps.updater-files.outputs.public_key }}
        run: |
          $signatureValue = (Get-Content -LiteralPath $env:UPDATER_SIGNATURE -Raw).Trim()
          if ($signatureValue -notmatch '^[A-Za-z0-9+/]+={0,2}$') {
            throw 'Updater signature must be one base64 line'
          }
          $publicKeyValue = [Convert]::ToBase64String(
            [System.IO.File]::ReadAllBytes($env:UPDATER_PUBLIC_KEY))
          if ($publicKeyValue -cne $env:TAURI_SIGNING_PUBLIC_KEY.Trim()) {
            throw 'Draft updater public key does not match the repository release key'
          }
          bun scripts/validate-updater-key-transition.ts
          if ($LASTEXITCODE -ne 0) {
            throw 'Updater signing key transition validation failed'
          }

          $decodedSignature = Join-Path $env:RUNNER_TEMP `
            "audiobud-private-updater-$env:GITHUB_RUN_ID.sig"
          [System.IO.File]::WriteAllBytes(
            $decodedSignature,
            [Convert]::FromBase64String($signatureValue))
          cargo run --locked --release `
            --manifest-path scripts/verify-updater-signature/Cargo.toml -- `
            $env:UPDATER_PUBLIC_KEY $decodedSignature $env:UPDATER_ARCHIVE
          if ($LASTEXITCODE -ne 0) {
            throw 'Private updater signature verification failed'
          }

      - name: Download latest prior stable installer
        id: prior-installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_TAG: ${{ steps.updater-meta.outputs.prior_tag }}
          PRIOR_VERSION: ${{ steps.updater-meta.outputs.prior_version }}
        run: |
          $installerName = "AudioBud_$($env:PRIOR_VERSION)_x64-setup.exe"
          $priorDirectory = Join-Path $env:RUNNER_TEMP `
            "audiobud-prior-installer-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $priorDirectory) {
            throw "Prior installer directory already exists: $priorDirectory"
          }
          New-Item -ItemType Directory -Path $priorDirectory | Out-Null
          gh release download $env:PRIOR_TAG `
            --dir $priorDirectory `
            --pattern $installerName
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download required prior installer $installerName"
          }
          $installer = Join-Path $priorDirectory $installerName
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Required prior installer was not downloaded: $installer"
          }
          if ((Get-Item -LiteralPath $installer).Length -le 0) {
            throw "Required prior installer is empty: $installer"
          }
          "path=$installer" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Apply private updater and preserve user data
        timeout-minutes: 10
        shell: pwsh
        env:
          TARGET_TAG: ${{ steps.updater-meta.outputs.tag }}
          TARGET_VERSION: ${{ steps.updater-meta.outputs.version }}
          PRIOR_TAG: ${{ steps.updater-meta.outputs.prior_tag }}
          PRIOR_VERSION: ${{ steps.updater-meta.outputs.prior_version }}
          UPDATER_ARCHIVE: ${{ steps.updater-files.outputs.archive }}
          UPDATER_SIGNATURE: ${{ steps.updater-files.outputs.signature }}
          PRIOR_INSTALLER: ${{ steps.prior-installer.outputs.path }}
        run: |
          $evidenceDirectory = Join-Path $env:RUNNER_TEMP `
            "audiobud-updater-evidence-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          Remove-Item Env:GH_TOKEN, Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          Write-Host 'Diagnostic only: This run is not release publication evidence.'
          Set-PSDebug -Trace 1
          try {
            & scripts/verify-updater-candidate.ps1 `
              -TargetCommit $env:TARGET_COMMIT `
              -TargetTag $env:TARGET_TAG `
              -TargetVersion $env:TARGET_VERSION `
              -ArchivePath $env:UPDATER_ARCHIVE `
              -SignaturePath $env:UPDATER_SIGNATURE `
              -PriorInstallerPath $env:PRIOR_INSTALLER `
              -EvidenceDirectory $evidenceDirectory `
              -PriorTag $env:PRIOR_TAG `
              -PriorVersion $env:PRIOR_VERSION
          } finally {
            Set-PSDebug -Off
          }
          "UPDATER_EVIDENCE_DIRECTORY=$evidenceDirectory" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Retain verifier diagnostics after success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audiobud-updater-diagnostic-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/audiobud-updater-evidence-${{ github.run_id }}-${{ github.run_attempt }}/diagnostics/*.log
          retention-days: 14
          if-no-files-found: warn
