# AudioBud signed Windows release build. The workflow builds the application,
# signs Tauri's patched package contents while bundling, signs the standalone
# executable and both finished installers, then verifies and attests the
# packaged files before uploading any artifact.
#
#   - workflow_dispatch (make_release: false) builds and signs a CI artifact.
#   - workflow_dispatch (store_candidate: true) builds and signs a CI artifact
#     with Store-specific offline WebView2 packaging.
#   - workflow_dispatch (make_release: true, store_candidate: false) or a
#     pushed v* tag also creates or reuses a draft GitHub release and attaches
#     the release artifacts.
#
# Normal release builds run only from main or an exact v* release tag. A Store
# candidate may also run from an immutable, SHA-suffixed v* candidate tag. This
# preserves the protected environment's main/v* deployment policy while
# binding the workflow, source checkout, provenance, and operator pin to one
# commit. Every path uses passwordless Azure authentication.
name: Release

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: "Create a draft GitHub release and attach the release artifacts"
        type: boolean
        default: false
      store_candidate:
        description: "Build a Microsoft Store candidate CI artifact with offline WebView2 packaging"
        type: boolean
        default: false
      expected_commit_sha:
        description: "Exact 40-character commit SHA required for every Store candidate"
        type: string
        required: false
        default: ""
  push:
    tags:
      - "v*"

concurrency:
  # One group prevents main and tag jobs for the same version from replacing
  # each other's draft assets.
  group: release-windows
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build and sign Windows installers
    if: >-
      github.ref == 'refs/heads/main' ||
      (
        startsWith(github.ref, 'refs/tags/v') &&
        (
          !contains(github.ref_name, '-store-candidate-') ||
          (github.event_name == 'workflow_dispatch' && inputs.store_candidate)
        )
      )
    environment: artifact-signing
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
      ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
      MODEL_ASSET_BASE_URL: https://github.com/jamditis/audiobud/releases/download/model-assets-v1
      SILERO_VAD_SHA256: a35ebf52fd3ce5f1469b2a36158dba761bc47b973ea3382b3186ca15b1f5af28
      SILERO_VAD_BYTES: 1807522
      STORE_CANDIDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.store_candidate }}
      VULKAN_RUNTIME_ARCHIVE_SHA256: 7d969f4d7b44e387667d3148f61559497c22d50cbe3d50adc9e5409afbce2df1
      VULKAN_RUNTIME_ARCHIVE_BYTES: 15738272
      WEBVIEW2_FIXED_VERSION: 150.0.4078.105
      WEBVIEW2_FIXED_DIRECTORY: Microsoft.WebView2.FixedVersionRuntime.150.0.4078.105.x64
      WEBVIEW2_FIXED_CAB_SHA256: 26c07cad95615a672cde8c1843a326e18ad25d691f004347544e5e099bff9b92
      WEBVIEW2_FIXED_CAB_BYTES: 297904860
    steps:
      # whisper-rs-sys cmake builds and the VS toolchain create paths well past
      # the legacy 260-character MAX_PATH limit.
      - name: Enable long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version and release tag
        id: meta
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          APP_TAG="v$VERSION"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.store_candidate }}" == "true" ]]; then
              TAG="$APP_TAG"
            else
              PUSHED="${{ github.ref_name }}"
              if [[ "$PUSHED" != "$APP_TAG" ]]; then
                echo "::error::Pushed tag '$PUSHED' does not match app version '$APP_TAG' from src-tauri/tauri.conf.json. Bump the version or push the matching tag."
                exit 1
              fi
              TAG="$PUSHED"
            fi
          else
            TAG="$APP_TAG"
          fi
          echo "Application version: $VERSION (release tag: $TAG)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Validate release mode
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          MAKE_RELEASE: ${{ inputs.make_release }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if ($env:MAKE_RELEASE -eq "true" -and $env:STORE_CANDIDATE -eq "true") {
            throw "Store candidate artifacts cannot be published as a GitHub release"
          }
          if ($env:STORE_CANDIDATE -eq "true") {
            if ($env:EXPECTED_COMMIT_SHA -notmatch "^[0-9a-f]{40}$") {
              throw "A Store candidate requires an exact lowercase 40-character expected commit SHA"
            }
            if ($env:EXPECTED_COMMIT_SHA -cne $env:GITHUB_SHA) {
              throw "Store candidate expected commit $env:EXPECTED_COMMIT_SHA does not match dispatched commit $env:GITHUB_SHA"
            }
            if ($env:REF_TYPE -eq "tag") {
              $shortCommit = $env:GITHUB_SHA.Substring(0, 12)
              $expectedTag = "v$env:APP_VERSION-store-candidate-$shortCommit"
              if ($env:REF_NAME -cne $expectedTag) {
                throw "Store candidate tag $env:REF_NAME does not match required immutable tag $expectedTag"
              }
            } elseif ($env:REF_TYPE -ne "branch" -or $env:REF_NAME -cne "main") {
              throw "Store candidates must use main or an immutable versioned candidate tag"
            }
            Write-Output "Store candidate source pinned to $env:GITHUB_SHA"
          }

      - name: Resolve package flavor
        id: package-flavor
        shell: pwsh
        run: |
          if ($env:STORE_CANDIDATE -eq "true") {
            "artifact_suffix=-store" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "artifact_suffix=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      # Keep this an exact semver. An unpinned setup-bun resolves its version
      # through an authenticated api.github.com request before compilation.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "./src-tauri -> target"
          key: windows-x86_64

      # The Windows build links whisper-vulkan. The SDK provides glslc and the
      # Vulkan headers and libraries required by the native build.
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # silero_vad_v4.onnx is gitignored, but bundle.resources ships
      # resources/**/* and the application needs the VAD model at runtime. The
      # pinned AudioBud model release carries the byte-identical hosted copy.
      - name: Download Silero VAD model
        shell: pwsh
        run: |
          $directory = "src-tauri/resources/models"
          $model = Join-Path $directory "silero_vad_v4.onnx"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          Invoke-WebRequest `
            -Uri "$env:MODEL_ASSET_BASE_URL/silero_vad_v4.onnx" `
            -OutFile $model -MaximumRetryCount 3 -RetryIntervalSec 5
          $modelBytes = (Get-Item -LiteralPath $model).Length
          if ($modelBytes -ne [long]$env:SILERO_VAD_BYTES) {
            throw "Downloaded Silero VAD model size mismatch: $modelBytes"
          }
          $modelHash = (Get-FileHash -LiteralPath $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($modelHash -ne $env:SILERO_VAD_SHA256) {
            throw "Downloaded Silero VAD model hash mismatch: $modelHash"
          }
          Get-Item -LiteralPath $model | Select-Object FullName, Length

      # vulkan-1.dll ships with GPU drivers, not the SDK. Fetch the pinned
      # LunarG runtime and expose its x64 loader to beforeBundleCommand.
      - name: Fetch Vulkan loader for bundling
        shell: pwsh
        run: |
          $version = "1.4.309.0"
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanRT-$version-Components.zip"
          $archive = Join-Path $env:RUNNER_TEMP "vulkanrt.zip"
          $directory = Join-Path $env:RUNNER_TEMP "vulkanrt"
          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          $archiveBytes = (Get-Item -LiteralPath $archive).Length
          if ($archiveBytes -ne [long]$env:VULKAN_RUNTIME_ARCHIVE_BYTES) {
            throw "Downloaded Vulkan runtime archive size mismatch: $archiveBytes"
          }
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -ne $env:VULKAN_RUNTIME_ARCHIVE_SHA256) {
            throw "Downloaded Vulkan runtime archive hash mismatch: $archiveHash"
          }
          Expand-Archive -Path $archive -DestinationPath $directory -Force
          $dll = Get-ChildItem -Recurse -Path $directory -Filter "vulkan-1.dll" |
            Where-Object { $_.FullName -match "\\x64\\" } |
            Select-Object -First 1
          if (-not $dll) { throw "vulkan-1.dll (x64) not found in $url" }
          "VULKAN_RUNTIME_DLL=$($dll.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "Staged Vulkan loader: $($dll.FullName) ($($dll.Length) bytes)"

      # The regular installer stays small and uses the system Evergreen
      # runtime. This pinned fixed runtime is used only by the additional
      # self-contained portable artifact below.
      - name: Fetch fixed WebView2 runtime
        if: ${{ env.STORE_CANDIDATE != 'true' }}
        shell: pwsh
        run: |
          $runtimeName = "Microsoft.WebView2.FixedVersionRuntime.$env:WEBVIEW2_FIXED_VERSION.x64"
          $archive = Join-Path $env:RUNNER_TEMP "Microsoft.WebView2.FixedVersionRuntime.150.0.4078.105.x64.cab"
          $url = "https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/b401c036-cfb8-4dc4-a58e-8766441df4ac/Microsoft.WebView2.FixedVersionRuntime.150.0.4078.105.x64.cab"
          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5

          $archiveBytes = (Get-Item -LiteralPath $archive).Length
          if ($archiveBytes -ne [long]$env:WEBVIEW2_FIXED_CAB_BYTES) {
            throw "Downloaded WebView2 fixed runtime size mismatch: $archiveBytes"
          }
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($archiveHash -ne $env:WEBVIEW2_FIXED_CAB_SHA256) {
            throw "Downloaded WebView2 fixed runtime hash mismatch: $archiveHash"
          }
          $archiveSignature = Get-AuthenticodeSignature -LiteralPath $archive
          if ($archiveSignature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Invalid Microsoft WebView2 CAB signature: $($archiveSignature.StatusMessage)"
          }
          if ($archiveSignature.SignerCertificate.Subject -notlike "*CN=Microsoft Corporation*") {
            throw "Unexpected WebView2 CAB signer: $($archiveSignature.SignerCertificate.Subject)"
          }

          $destination = Join-Path $env:GITHUB_WORKSPACE "src-tauri"
          $runtimeDirectory = Join-Path $destination $runtimeName
          if (Test-Path -LiteralPath $runtimeDirectory) {
            throw "WebView2 fixed runtime directory already exists: $runtimeDirectory"
          }
          & "$env:SystemRoot\System32\expand.exe" $archive "-F:*" $destination
          if ($LASTEXITCODE -ne 0) {
            throw "expand.exe failed to extract the WebView2 fixed runtime"
          }
          if (-not (Test-Path -LiteralPath $runtimeDirectory -PathType Container)) {
            throw "Extracted WebView2 fixed runtime not found: $runtimeDirectory"
          }
          $browser = Join-Path $runtimeDirectory "msedgewebview2.exe"
          if (-not (Test-Path -LiteralPath $browser -PathType Leaf)) {
            throw "Extracted WebView2 browser executable not found: $browser"
          }

      # Keep Cargo's target directory short so whisper-rs-sys cmake paths stay
      # below MAX_PATH. This is also the root for every signing path.
      - name: Shorten build path
        shell: pwsh
        run: |
          $drive = Split-Path -Qualifier $env:GITHUB_WORKSPACE
          $targetDirectory = "$drive\t"
          $portableTargetDirectory = "$drive\p"
          New-Item -ItemType Directory -Force -Path $targetDirectory | Out-Null
          New-Item -ItemType Directory -Force -Path $portableTargetDirectory | Out-Null
          "CARGO_TARGET_DIR=$targetDirectory" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PORTABLE_TARGET_DIR=$portableTargetDirectory" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Keep the cheap reproducibility properties even though the final
      # Authenticode timestamp makes signed installers intentionally differ.
      # SOURCE_DATE_EPOCH makes rustc pass /Brepro to link.exe; path remapping
      # keeps runner-specific absolute paths out of the Rust output.
      - name: Configure reproducible Rust build
        shell: pwsh
        run: |
          $sourceDateEpoch = git show -s --format=%ct
          if ($LASTEXITCODE -ne 0 -or $sourceDateEpoch -notmatch "^\d+$") {
            throw "Could not resolve the source commit timestamp"
          }
          "SOURCE_DATE_EPOCH=$sourceDateEpoch" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $remapFlags = @(
            "--remap-path-prefix=$env:GITHUB_WORKSPACE=.",
            "--remap-path-prefix=$env:CARGO_TARGET_DIR=.target",
            "--remap-path-prefix=$env:PORTABLE_TARGET_DIR=.portable-target"
          )
          if ($env:CARGO_HOME) {
            $remapFlags += "--remap-path-prefix=$env:CARGO_HOME=.cargo"
          }
          "RUSTFLAGS=$($remapFlags -join ' ')" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "SOURCE_DATE_EPOCH=$sourceDateEpoch"
          Write-Output "Rust path prefixes remapped"

      # Disable native CPU targeting and SIMD above SSE4.2 so the x86_64 build
      # runs on CPUs without AVX or FMA. Vulkan handles the main compute load.
      - name: Build application without bundling
        shell: pwsh
        env:
          GGML_NATIVE: "OFF"
          GGML_AVX: "OFF"
          GGML_AVX2: "OFF"
          GGML_FMA: "OFF"
          GGML_F16C: "OFF"
        run: bun run tauri build --no-bundle --ci -- --locked

      - name: Resolve signing paths
        id: signing-paths
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if (-not [System.IO.Path]::IsPathRooted($env:CARGO_TARGET_DIR)) {
            throw "CARGO_TARGET_DIR must be an absolute path"
          }

          $application = Join-Path $env:CARGO_TARGET_DIR "release\audiobud.exe"
          $nsis = Join-Path $env:CARGO_TARGET_DIR "release\bundle\nsis\AudioBud_$($env:APP_VERSION)_x64-setup.exe"
          $msi = Join-Path $env:CARGO_TARGET_DIR "release\bundle\msi\AudioBud_$($env:APP_VERSION)_x64_en-US.msi"

          if (-not (Test-Path -LiteralPath $application -PathType Leaf)) {
            throw "Application executable not found: $application"
          }

          "app=$application" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "nsis=$nsis" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "msi=$msi" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Authenticate after compilation so no signing token is requested for a
      # build that cannot produce the application executable.
      - name: Authenticate to Azure
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Tauri patches the application executable separately for MSI and NSIS.
      # Its signing hook must run after each patch or the packages contain an
      # unsigned executable. Pin the module to the version used by the action.
      - name: Install Artifact Signing module
        shell: pwsh
        run: |
          Install-Module -Name ArtifactSigning -RequiredVersion 0.1.8 `
            -Force -Repository PSGallery -Scope CurrentUser
          Import-Module ArtifactSigning -RequiredVersion 0.1.8 -Force
          Get-Command Invoke-ArtifactSigning -ErrorAction Stop | Out-Null

      - name: Clear Store WebView2 installer cache
        if: ${{ env.STORE_CANDIDATE == 'true' }}
        shell: pwsh
        run: |
          $tauriCache = Join-Path $env:LOCALAPPDATA "tauri"
          if (-not (Test-Path -LiteralPath $tauriCache)) {
            return
          }

          Get-ChildItem -LiteralPath $tauriCache -File -Recurse |
            Where-Object { $_.Name -match "WebView2|MicrosoftEdge" } |
            Remove-Item -Force

      - name: Bundle Store installers
        if: ${{ env.STORE_CANDIDATE == 'true' }}
        shell: pwsh
        run: bun run bundle:store

      # Bundle without updater credentials. This runs beforeBundleCommand and
      # the packaging subprocesses that do not need access to the update key.
      - name: Bundle GitHub installers
        if: ${{ env.STORE_CANDIDATE != 'true' }}
        shell: pwsh
        run: |
          bun run tauri bundle --verbose --bundles nsis,msi `
            --config src-tauri/tauri.signing.conf.json --ci

      - name: Create updater archive
        if: ${{ env.STORE_CANDIDATE != 'true' }}
        id: updater-archive
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          NSIS_PATH: ${{ steps.signing-paths.outputs.nsis }}
        run: |
          $nsisDirectory = Split-Path -Parent $env:NSIS_PATH
          $archive = Join-Path $nsisDirectory `
            "AudioBud_$($env:APP_VERSION)_x64-setup.nsis.zip"
          if (-not (Test-Path -LiteralPath $env:NSIS_PATH -PathType Leaf)) {
            throw "Updater installer not found: $env:NSIS_PATH"
          }
          if (Test-Path -LiteralPath $archive) {
            throw "Updater archive already exists: $archive"
          }

          Compress-Archive -LiteralPath $env:NSIS_PATH `
            -DestinationPath $archive -CompressionLevel NoCompression
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Updater archive was not created: $archive"
          }
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Only the signer process receives the long-lived updater credentials.
      # Installer bundling and its beforeBundleCommand hook have already ended.
      - name: Sign updater archive
        if: ${{ env.STORE_CANDIDATE != 'true' }}
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_ARCHIVE: ${{ steps.updater-archive.outputs.archive }}
        run: |
          bun run tauri signer sign "$env:UPDATER_ARCHIVE"
          if ($LASTEXITCODE -ne 0) {
            throw "Updater archive signing failed"
          }
          if (-not (Test-Path -LiteralPath "$env:UPDATER_ARCHIVE.sig" -PathType Leaf)) {
            throw "Updater signature was not created"
          }

      - name: Resolve installer paths
        shell: pwsh
        env:
          NSIS_PATH: ${{ steps.signing-paths.outputs.nsis }}
          MSI_PATH: ${{ steps.signing-paths.outputs.msi }}
        run: |
          $nsisDirectory = Split-Path -Parent $env:NSIS_PATH
          $msiDirectory = Split-Path -Parent $env:MSI_PATH
          $nsisFiles = @(Get-ChildItem -LiteralPath $nsisDirectory -Filter "*.exe" -File)
          $msiFiles = @(Get-ChildItem -LiteralPath $msiDirectory -Filter "*.msi" -File)

          if ($nsisFiles.Count -ne 1) {
            throw "Expected one NSIS installer, found $($nsisFiles.Count)"
          }
          if ($msiFiles.Count -ne 1) {
            throw "Expected one MSI installer, found $($msiFiles.Count)"
          }
          if ($nsisFiles[0].FullName -ne $env:NSIS_PATH) {
            throw "Unexpected NSIS installer path: $($nsisFiles[0].FullName)"
          }
          if ($msiFiles[0].FullName -ne $env:MSI_PATH) {
            throw "Unexpected MSI installer path: $($msiFiles[0].FullName)"
          }

      # Tauri signs the final NSIS installer through signCommand before it
      # creates this updater archive. Validate the archived installer now; the
      # later Azure action signs the standalone release copy independently.
      - name: Resolve updater artifact paths
        if: ${{ env.STORE_CANDIDATE != 'true' }}
        id: updater-paths
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          UPDATER_ARCHIVE: ${{ steps.updater-archive.outputs.archive }}
        run: |
          $nsisDirectory = Join-Path $env:CARGO_TARGET_DIR "release\bundle\nsis"
          $expectedArchive = Join-Path $nsisDirectory "AudioBud_$($env:APP_VERSION)_x64-setup.nsis.zip"
          $archive = $env:UPDATER_ARCHIVE
          if ($archive -ne $expectedArchive) {
            throw "Unexpected updater archive path: $archive"
          }
          $signature = "$archive.sig"
          foreach ($path in @($archive, $signature)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Updater artifact not found: $path"
            }
            if ((Get-Item -LiteralPath $path).Length -le 0) {
              throw "Updater artifact is empty: $path"
            }
          }

          $signatureValue = (Get-Content -LiteralPath $signature -Raw).Trim()
          if ($signatureValue -notmatch '^[A-Za-z0-9+/=]+$') {
            throw "Updater signature is not a single base64 value"
          }

          $verificationDirectory = Join-Path $env:RUNNER_TEMP `
            "audiobud-updater-verification-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $verificationDirectory) {
            throw "Updater verification directory already exists: $verificationDirectory"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $verificationDirectory
          $installers = @(Get-ChildItem -LiteralPath $verificationDirectory -Filter "*.exe" -File -Recurse)
          if ($installers.Count -ne 1) {
            throw "Expected one installer in updater archive, found $($installers.Count)"
          }

          $archivedSignature = Get-AuthenticodeSignature -LiteralPath $installers[0].FullName
          if ($archivedSignature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Invalid Authenticode signature in updater archive: $($archivedSignature.StatusMessage)"
          }
          if (-not $archivedSignature.TimeStamperCertificate) {
            throw "Timestamp certificate missing from updater installer"
          }
          if ($archivedSignature.SignerCertificate.Subject -notlike "*CN=Joseph Amditis*") {
            throw "Unexpected updater installer signer: $($archivedSignature.SignerCertificate.Subject)"
          }

          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter "signtool.exe" -File -Recurse |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $signTool) { throw "signtool.exe was not found" }
          & $signTool.FullName verify /pa /all /v $installers[0].FullName
          if ($LASTEXITCODE -ne 0) {
            throw "signtool verification failed for updater installer"
          }

          $publicKeyValue = $env:TAURI_SIGNING_PUBLIC_KEY
          if ($publicKeyValue -isnot [string] -or [string]::IsNullOrWhiteSpace($publicKeyValue)) {
            throw "TAURI_SIGNING_PUBLIC_KEY repository variable is missing"
          }
          $publicKeyValue = $publicKeyValue.Trim()
          bun scripts/validate-updater-key-transition.ts
          if ($LASTEXITCODE -ne 0) {
            throw "Updater signing key transition validation failed"
          }
          try {
            $publicKeyBytes = [Convert]::FromBase64String($publicKeyValue)
            $signatureBytes = [Convert]::FromBase64String($signatureValue)
          } catch {
            throw "Updater public key or signature has invalid outer base64 encoding"
          }

          $publicKeyPath = Join-Path $env:CARGO_TARGET_DIR `
            "release\updater-signing-public-key.pub"
          $decodedSignaturePath = Join-Path $verificationDirectory "updater-signature.sig"
          [System.IO.File]::WriteAllBytes($publicKeyPath, $publicKeyBytes)
          [System.IO.File]::WriteAllBytes($decodedSignaturePath, $signatureBytes)

          $verifierTargetDirectory = Join-Path $env:RUNNER_TEMP `
            "audiobud-updater-verifier-target-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $verifierTargetDirectory) {
            throw "Updater verifier target directory already exists: $verifierTargetDirectory"
          }
          $releaseTargetDirectory = $env:CARGO_TARGET_DIR
          try {
            $env:CARGO_TARGET_DIR = $verifierTargetDirectory
            cargo run --locked --release `
              --manifest-path scripts/verify-updater-signature/Cargo.toml -- `
              $publicKeyPath $decodedSignaturePath $archive
            if ($LASTEXITCODE -ne 0) {
              throw "Updater minisign verification failed"
            }
          } finally {
            $env:CARGO_TARGET_DIR = $releaseTargetDirectory
          }

          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "signature=$signature" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "public_key=$publicKeyPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Tauri records fixedRuntime as a build resource, so this variant needs
      # its own compilation as well as its own NSIS bundle. A separate target
      # directory preserves the regular installers and signed updater archive.
      - name: Build fixed-runtime portable application
        if: ${{ env.STORE_CANDIDATE != 'true' }}
        shell: pwsh
        env:
          GGML_NATIVE: "OFF"
          GGML_AVX: "OFF"
          GGML_AVX2: "OFF"
          GGML_FMA: "OFF"
          GGML_F16C: "OFF"
        run: |
          $env:CARGO_TARGET_DIR = $env:PORTABLE_TARGET_DIR
          bun run tauri build --no-bundle --config src-tauri/tauri.portable-webview.conf.json --ci -- --locked

      - name: Bundle fixed-runtime portable installer
        if: ${{ env.STORE_CANDIDATE != 'true' }}
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = $env:PORTABLE_TARGET_DIR
          bun run tauri bundle --verbose --bundles nsis `
            --config src-tauri/tauri.signing.conf.json `
            --config src-tauri/tauri.portable-webview.conf.json --ci

      - name: Resolve fixed-runtime portable path
        if: ${{ env.STORE_CANDIDATE != 'true' }}
        id: portable-webview-path
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $directory = Join-Path $env:PORTABLE_TARGET_DIR "release\bundle\nsis"
          $source = Join-Path $directory "AudioBud_$($env:APP_VERSION)_x64-setup.exe"
          $artifactDirectory = Join-Path $env:CARGO_TARGET_DIR "release"
          $path = Join-Path $artifactDirectory `
            "AudioBud_$($env:APP_VERSION)_x64-portable-webview-setup.exe"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Fixed-runtime portable installer not found: $source"
          }
          if (Test-Path -LiteralPath $path) {
            throw "Portable release artifact already exists: $path"
          }
          New-Item -ItemType Directory -Force -Path $artifactDirectory | Out-Null
          Move-Item -LiteralPath $source -Destination $path
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify Store WebView2 offline installers
        if: ${{ env.STORE_CANDIDATE == 'true' }}
        id: store-webview2
        shell: pwsh
        env:
          NSIS_PATH: ${{ steps.signing-paths.outputs.nsis }}
          MSI_PATH: ${{ steps.signing-paths.outputs.msi }}
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter "signtool.exe" -File -Recurse |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $signTool) { throw "signtool.exe was not found" }

          function Assert-MicrosoftWebView2Signature {
            param([Parameter(Mandatory = $true)][string] $Path)

            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              throw "WebView2 installer not found: $Path"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $Path
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid WebView2 installer signature for $Path`: $($signature.StatusMessage)"
            }
            if ($signature.SignerCertificate.Subject -notlike "*CN=Microsoft Corporation*") {
              throw "Unexpected WebView2 installer signer for $Path`: $($signature.SignerCertificate.Subject)"
            }

            & $signTool.FullName verify /pa /v $Path
            if ($LASTEXITCODE -ne 0) {
              throw "signtool verification failed for WebView2 installer: $Path"
            }
          }

          $tauriCache = Join-Path $env:LOCALAPPDATA "tauri"
          $cacheInstallers = @(
            Get-ChildItem -LiteralPath $tauriCache -File -Recurse |
              Where-Object { $_.Name -match "WebView2|MicrosoftEdge" -and $_.Extension -eq ".exe" }
          )
          if ($cacheInstallers.Count -lt 1) {
            throw "Expected at least one Store WebView2 offline installer in the Tauri cache"
          }
          foreach ($cacheInstaller in $cacheInstallers) {
            Assert-MicrosoftWebView2Signature -Path $cacheInstaller.FullName
          }

          $dark = Get-ChildItem -LiteralPath $tauriCache -Filter "dark.exe" -File -Recurse |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $dark) { throw "dark.exe was not found in the Tauri WiX tools cache" }

          $msiBinaryDirectory = Join-Path $env:RUNNER_TEMP `
            "audiobud-msi-binary-verification-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $msiBinaryDirectory) {
            throw "MSI binary verification directory already exists: $msiBinaryDirectory"
          }
          New-Item -ItemType Directory -Path $msiBinaryDirectory | Out-Null
          $wxsPath = Join-Path $msiBinaryDirectory "package.wxs"
          & $dark.FullName -nologo -x $msiBinaryDirectory -out $wxsPath $env:MSI_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "dark.exe failed to extract MSI embedded binaries"
          }

          $embeddedInstallers = @(
            Get-ChildItem -LiteralPath $msiBinaryDirectory -File -Recurse |
              Where-Object { $_.Name -match "WebView2|MicrosoftEdge" -and $_.Extension -eq ".exe" }
          )
          if ($embeddedInstallers.Count -lt 1) {
            throw "Expected at least one MSI-embedded WebView2 offline installer"
          }

          $sevenZip = Get-Command "7z.exe" -ErrorAction SilentlyContinue
          $sevenZipPath = if ($sevenZip) {
            $sevenZip.Source
          } else {
            Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          }
          if (-not (Test-Path -LiteralPath $sevenZipPath -PathType Leaf)) {
            throw "7z.exe was not found"
          }
          $nsisBinaryDirectory = Join-Path $env:RUNNER_TEMP `
            "audiobud-nsis-binary-verification-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $nsisBinaryDirectory) {
            throw "NSIS binary verification directory already exists: $nsisBinaryDirectory"
          }
          New-Item -ItemType Directory -Path $nsisBinaryDirectory | Out-Null
          & $sevenZipPath x "-o$nsisBinaryDirectory" -y $env:NSIS_PATH
          if ($LASTEXITCODE -ne 0) {
            throw "7z.exe failed to extract NSIS embedded binaries"
          }

          $nsisEmbeddedInstallers = @(
            Get-ChildItem -LiteralPath $nsisBinaryDirectory -File -Recurse |
              Where-Object { $_.Name -match "WebView2|MicrosoftEdge" -and $_.Extension -eq ".exe" }
          )
          if ($nsisEmbeddedInstallers.Count -lt 1) {
            throw "Expected at least one NSIS-embedded WebView2 offline installer"
          }

          $webView2PayloadDirectory = Join-Path $env:CARGO_TARGET_DIR "release\webview2-payload"
          if (Test-Path -LiteralPath $webView2PayloadDirectory) {
            Remove-Item -LiteralPath $webView2PayloadDirectory -Recurse -Force
          }
          New-Item -ItemType Directory -Path $webView2PayloadDirectory | Out-Null
          for ($index = 0; $index -lt $embeddedInstallers.Count; $index += 1) {
            $embeddedInstaller = $embeddedInstallers[$index]
            Assert-MicrosoftWebView2Signature -Path $embeddedInstaller.FullName
            $destination = Join-Path $webView2PayloadDirectory `
              "msi-$index-$($embeddedInstaller.Name)"
            Copy-Item -LiteralPath $embeddedInstaller.FullName -Destination $destination
          }
          for ($index = 0; $index -lt $nsisEmbeddedInstallers.Count; $index += 1) {
            $embeddedInstaller = $nsisEmbeddedInstallers[$index]
            Assert-MicrosoftWebView2Signature -Path $embeddedInstaller.FullName
            $destination = Join-Path $webView2PayloadDirectory `
              "nsis-$index-$($embeddedInstaller.Name)"
            Copy-Item -LiteralPath $embeddedInstaller.FullName -Destination $destination
          }

          "path=$webView2PayloadDirectory" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "Verified Store WebView2 offline installers"

      # The standalone executable is restored to its pre-bundle state after
      # Tauri finishes. Sign it alongside both outer installer packages.
      - name: Sign release outputs
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files: |
            ${{ steps.signing-paths.outputs.app }}
            ${{ steps.signing-paths.outputs.nsis }}
            ${{ steps.signing-paths.outputs.msi }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: AudioBud
          description-url: https://audiobud.amditis.tech/
          timeout: 600

      - name: Verify Authenticode signatures
        shell: pwsh
        env:
          APP_PATH: ${{ steps.signing-paths.outputs.app }}
          NSIS_PATH: ${{ steps.signing-paths.outputs.nsis }}
          MSI_PATH: ${{ steps.signing-paths.outputs.msi }}
          PORTABLE_PATH: ${{ steps.portable-webview-path.outputs.path }}
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter "signtool.exe" -File -Recurse |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $signTool) { throw "signtool.exe was not found" }

          $files = @($env:APP_PATH, $env:NSIS_PATH, $env:MSI_PATH)
          if ($env:PORTABLE_PATH) {
            $files += $env:PORTABLE_PATH
          }
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Signed output not found: $file"
            }

            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid Authenticode signature for $file`: $($signature.StatusMessage)"
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "Timestamp certificate missing from $file"
            }
            if ($signature.SignerCertificate.Subject -notlike "*CN=Joseph Amditis*") {
              throw "Unexpected signer for $file`: $($signature.SignerCertificate.Subject)"
            }

            & $signTool.FullName verify /pa /all /v $file
            if ($LASTEXITCODE -ne 0) {
              throw "signtool verification failed for $file"
            }
          }

      # Install the large variant in portable mode on the disposable runner.
      # This verifies the runtime is actually packaged, portable state remains
      # app-local, and the Windows 10 AppContainer ACLs are present.
      - name: Verify fixed-runtime portable install
        if: ${{ env.STORE_CANDIDATE != 'true' }}
        id: portable-webview-payload
        shell: pwsh
        env:
          PORTABLE_PATH: ${{ steps.portable-webview-path.outputs.path }}
        run: |
          $installDirectory = Join-Path $env:RUNNER_TEMP `
            "audiobud-portable-webview-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $installDirectory) {
            throw "Portable verification directory already exists: $installDirectory"
          }

          $process = Start-Process -FilePath $env:PORTABLE_PATH `
            -ArgumentList @("/S", "/PORTABLE", "/D=$installDirectory") `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Fixed-runtime portable install failed with exit code $($process.ExitCode)"
          }

          $marker = Join-Path $installDirectory "portable"
          if ((Get-Content -LiteralPath $marker -Raw) -ne "AudioBud Portable Mode") {
            throw "Portable marker is missing or invalid"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $installDirectory "Data") -PathType Container)) {
            throw "Portable Data directory is missing"
          }
          if (Test-Path -LiteralPath (Join-Path $installDirectory "uninstall.exe")) {
            throw "Portable install must not create an uninstaller"
          }

          $runtimeDirectory = Join-Path $installDirectory $env:WEBVIEW2_FIXED_DIRECTORY
          if (-not (Test-Path -LiteralPath $runtimeDirectory -PathType Container)) {
            throw "Packaged WebView2 fixed runtime is missing: $runtimeDirectory"
          }
          $browser = Join-Path $runtimeDirectory "msedgewebview2.exe"
          if (-not (Test-Path -LiteralPath $browser -PathType Leaf)) {
            throw "Packaged WebView2 browser executable is missing"
          }

          $requiredSids = @("S-1-15-2-2", "S-1-15-2-1")
          function Get-NumericAclRules {
            param([string] $Path, [string] $Label)

            $acl = Get-Acl -LiteralPath $Path
            Write-Host "[$Label] icacls output:"
            & "$env:SystemRoot\System32\icacls.exe" $Path | Out-Host
            Write-Host "[$Label] SDDL: $($acl.GetSecurityDescriptorSddlForm(
              [System.Security.AccessControl.AccessControlSections]::Access))"
            $rules = @($acl.GetAccessRules(
              $true,
              $true,
              [System.Security.Principal.SecurityIdentifier]))
            $rules | Format-Table IdentityReference, FileSystemRights, `
              InheritanceFlags, PropagationFlags, AccessControlType, IsInherited `
              -AutoSize | Out-String | Write-Host
            return $rules
          }

          function Test-AllowReadAndExecuteAcl {
            param(
              [object[]] $Rules,
              [string] $Sid,
              [bool] $RequireDirectoryInheritance,
              [bool] $RequireInherited
            )

            $requiredRights = [System.Security.AccessControl.FileSystemRights]::ReadAndExecute
            $requiredInheritance = `
              [System.Security.AccessControl.InheritanceFlags]::ObjectInherit -bor `
              [System.Security.AccessControl.InheritanceFlags]::ContainerInherit
            foreach ($rule in $Rules) {
              $hasRights = `
                ($rule.FileSystemRights -band $requiredRights) -eq $requiredRights
              $hasInheritance = `
                (-not $RequireDirectoryInheritance) -or `
                (($rule.InheritanceFlags -band $requiredInheritance) -eq $requiredInheritance)
              $isInherited = (-not $RequireInherited) -or $rule.IsInherited
              if ($rule.IdentityReference.Value -eq $Sid -and
                  $rule.AccessControlType -eq [System.Security.AccessControl.AccessControlType]::Allow -and
                  $hasRights -and $hasInheritance -and $isInherited) {
                return $true
              }
            }
            return $false
          }

          $runtimeRules = @(
            Get-NumericAclRules -Path $runtimeDirectory -Label "fixed runtime directory"
          )
          foreach ($sid in $requiredSids) {
            if (-not (Test-AllowReadAndExecuteAcl `
                -Rules $runtimeRules -Sid $sid `
                -RequireDirectoryInheritance $true -RequireInherited $false)) {
              throw "Required inheritable WebView2 fixed-runtime read/execute ACL is missing: $sid"
            }
          }

          $browserRules = @(
            Get-NumericAclRules -Path $browser -Label "fixed runtime browser"
          )
          foreach ($sid in $requiredSids) {
            if (-not (Test-AllowReadAndExecuteAcl `
                -Rules $browserRules -Sid $sid `
                -RequireDirectoryInheritance $false -RequireInherited $true)) {
              throw "WebView2 browser did not inherit the required read/execute ACL: $sid"
            }
          }

          $peFiles = @(Get-ChildItem -LiteralPath $installDirectory -File -Recurse |
            Where-Object { $_.Extension -in @(".exe", ".dll") })
          if ($peFiles.Count -eq 0) {
            throw "No portable PE files found"
          }
          foreach ($peFile in $peFiles) {
            $signature = Get-AuthenticodeSignature -LiteralPath $peFile.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid portable PE signature for $($peFile.FullName): $($signature.StatusMessage)"
            }
          }

          "path=$installDirectory" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Extract the MSI and perform a silent NSIS install on the disposable
      # runner. Verify the packaged app copies and the generated uninstaller,
      # then confirm Tauri did not alter the bundled third-party DLLs.
      - name: Verify packaged application signatures
        id: packaged-payload
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          NSIS_PATH: ${{ steps.signing-paths.outputs.nsis }}
          MSI_PATH: ${{ steps.signing-paths.outputs.msi }}
          WEBVIEW2_PAYLOAD_PATH: ${{ steps.store-webview2.outputs.path }}
          PORTABLE_PAYLOAD_PATH: ${{ steps.portable-webview-payload.outputs.path }}
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter "signtool.exe" -File -Recurse |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $signTool) { throw "signtool.exe was not found" }

          function Assert-AudioBudSignature {
            param([Parameter(Mandatory = $true)][string] $Path)

            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              throw "Packaged signed file not found: $Path"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $Path
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid packaged signature for $Path`: $($signature.StatusMessage)"
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "Timestamp certificate missing from $Path"
            }
            if ($signature.SignerCertificate.Subject -notlike "*CN=Joseph Amditis*") {
              throw "Unexpected signer for $Path`: $($signature.SignerCertificate.Subject)"
            }

            & $signTool.FullName verify /pa /all /v $Path
            if ($LASTEXITCODE -ne 0) {
              throw "signtool verification failed for packaged file $Path"
            }
          }

          function Assert-TrustedPeSignature {
            param([Parameter(Mandatory = $true)][string] $Path)

            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              throw "Packaged PE file not found: $Path"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $Path
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid packaged PE signature for $Path`: $($signature.StatusMessage)"
            }

            & $signTool.FullName verify /pa /all /v $Path
            if ($LASTEXITCODE -ne 0) {
              throw "signtool verification failed for packaged PE file $Path"
            }
          }

          function Assert-PackagedPeSignatures {
            param([Parameter(Mandatory = $true)][string] $Root)

            $peFiles = @(
              Get-ChildItem -LiteralPath $Root -File -Recurse |
                Where-Object { $_.Extension -in @(".exe", ".dll") }
            )
            if ($peFiles.Count -eq 0) {
              throw "No packaged PE files found in $Root"
            }

            foreach ($peFile in $peFiles) {
              Assert-TrustedPeSignature -Path $peFile.FullName
            }
          }

          $verificationRoot = Join-Path $env:RUNNER_TEMP `
            "audiobud-signature-verification-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $verificationRoot) {
            throw "Verification directory already exists: $verificationRoot"
          }
          $msiDirectory = Join-Path $verificationRoot "msi"
          $nsisDirectory = Join-Path $verificationRoot "nsis"
          New-Item -ItemType Directory -Path $msiDirectory, $nsisDirectory | Out-Null

          $msiLog = Join-Path $verificationRoot "msi-extraction.log"
          $msiArguments = @(
            "/a",
            "`"$env:MSI_PATH`"",
            "/qn",
            "TARGETDIR=`"$msiDirectory`"",
            "/l*v",
            "`"$msiLog`""
          )
          $msiProcess = Start-Process -FilePath "$env:SystemRoot\System32\msiexec.exe" `
            -ArgumentList $msiArguments -Wait -PassThru -NoNewWindow
          if ($msiProcess.ExitCode -ne 0) {
            Get-Content -LiteralPath $msiLog -Tail 100 -ErrorAction SilentlyContinue
            throw "MSI administrative extraction failed with exit code $($msiProcess.ExitCode)"
          }

          $msiInstallLog = Join-Path $verificationRoot "msi-install.log"
          $msiInstallArguments = @(
            "/i",
            "`"$env:MSI_PATH`"",
            "/qn",
            "/norestart",
            "/l*v",
            "`"$msiInstallLog`""
          )
          $msiInstallProcess = Start-Process -FilePath "$env:SystemRoot\System32\msiexec.exe" `
            -ArgumentList $msiInstallArguments -Wait -PassThru -NoNewWindow
          if ($msiInstallProcess.ExitCode -notin @(0, 3010)) {
            Get-Content -LiteralPath $msiInstallLog -Tail 100 -ErrorAction SilentlyContinue
            throw "MSI silent install failed with exit code $($msiInstallProcess.ExitCode)"
          }

          $msiUninstallLog = Join-Path $verificationRoot "msi-uninstall.log"
          $msiUninstallArguments = @(
            "/x",
            "`"$env:MSI_PATH`"",
            "/qn",
            "/norestart",
            "/l*v",
            "`"$msiUninstallLog`""
          )
          $msiUninstallProcess = Start-Process -FilePath "$env:SystemRoot\System32\msiexec.exe" `
            -ArgumentList $msiUninstallArguments -Wait -PassThru -NoNewWindow
          if ($msiUninstallProcess.ExitCode -notin @(0, 3010)) {
            Get-Content -LiteralPath $msiUninstallLog -Tail 100 -ErrorAction SilentlyContinue
            throw "MSI silent uninstall failed with exit code $($msiUninstallProcess.ExitCode)"
          }

          $nsisProcess = Start-Process -FilePath $env:NSIS_PATH `
            -ArgumentList @("/S", "/D=$nsisDirectory") `
            -Wait -PassThru
          if ($nsisProcess.ExitCode -ne 0) {
            throw "NSIS installation failed with exit code $($nsisProcess.ExitCode)"
          }

          $msiApplications = @(
            Get-ChildItem -LiteralPath $msiDirectory -Filter "audiobud.exe" -File -Recurse
          )
          if ($msiApplications.Count -ne 1) {
            throw "Expected one packaged MSI application, found $($msiApplications.Count)"
          }

          $nsisApplication = Join-Path $nsisDirectory "audiobud.exe"
          $nsisUninstaller = Join-Path $nsisDirectory "uninstall.exe"
          Assert-AudioBudSignature -Path $msiApplications[0].FullName
          Assert-AudioBudSignature -Path $nsisApplication
          Assert-AudioBudSignature -Path $nsisUninstaller
          Assert-PackagedPeSignatures -Root $msiDirectory
          Assert-PackagedPeSignatures -Root $nsisDirectory

          if ($env:STORE_CANDIDATE -eq "true") {
            $updateEndpoint = "https://github.com/jamditis/audiobud/releases/download/update-feed/latest.json"
            $liveManifest = Invoke-RestMethod -Uri $updateEndpoint
            try {
              $candidateVersion = [System.Management.Automation.SemanticVersion]$env:APP_VERSION
              $liveVersion = [System.Management.Automation.SemanticVersion]$liveManifest.version
            } catch {
              throw "Could not compare Store candidate and live update-feed versions: $($_.Exception.Message)"
            }
            if ($liveVersion -gt $candidateVersion) {
              throw "Store candidate $env:APP_VERSION is behind live update feed $($liveManifest.version)"
            }

            $applicationHashBeforeProbe = (Get-FileHash -LiteralPath $nsisApplication -Algorithm SHA256).Hash
            $updateProbeStdout = Join-Path $verificationRoot "store-update-probe.stdout.log"
            $updateProbeStderr = Join-Path $verificationRoot "store-update-probe.stderr.log"
            $updateProbe = Start-Process -FilePath $nsisApplication `
              -ArgumentList @(
                "--install-update",
                "--install-update-endpoint",
                $updateEndpoint,
                "--start-hidden",
                "--no-tray"
              ) `
              -RedirectStandardOutput $updateProbeStdout `
              -RedirectStandardError $updateProbeStderr `
              -PassThru
            if (-not $updateProbe.WaitForExit(120000)) {
              Stop-Process -Id $updateProbe.Id -Force -ErrorAction SilentlyContinue
              Get-Content -LiteralPath $updateProbeStdout -Tail 100 -ErrorAction SilentlyContinue
              Get-Content -LiteralPath $updateProbeStderr -Tail 100 -ErrorAction SilentlyContinue
              throw "Store NSIS signed-update probe timed out"
            }
            if ($updateProbe.ExitCode -ne 0) {
              Get-Content -LiteralPath $updateProbeStdout -Tail 100 -ErrorAction SilentlyContinue
              Get-Content -LiteralPath $updateProbeStderr -Tail 100 -ErrorAction SilentlyContinue
              throw "Store NSIS signed-update probe failed with exit code $($updateProbe.ExitCode)"
            }
            $applicationHashAfterProbe = (Get-FileHash -LiteralPath $nsisApplication -Algorithm SHA256).Hash
            if ($applicationHashAfterProbe -ne $applicationHashBeforeProbe) {
              throw "Store NSIS signed-update probe changed the installed application"
            }
          }

          $runtimeFiles = @(
            "msvcp140.dll",
            "msvcp140_1.dll",
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "vulkan-1.dll",
            "DirectML.dll"
          )
          foreach ($runtimeFile in $runtimeFiles) {
            $source = Join-Path $env:CARGO_TARGET_DIR "release\$runtimeFile"
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Runtime source file not found: $source"
            }
            $sourceHash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash

            foreach ($packageDirectory in @($msiDirectory, $nsisDirectory)) {
              $copies = @(
                Get-ChildItem -LiteralPath $packageDirectory -Filter $runtimeFile -File -Recurse
              )
              if ($copies.Count -ne 1) {
                throw "Expected one $runtimeFile in $packageDirectory, found $($copies.Count)"
              }
              $copyHash = (Get-FileHash -LiteralPath $copies[0].FullName -Algorithm SHA256).Hash
              if ($copyHash -ne $sourceHash) {
                throw "Runtime file changed during bundling: $($copies[0].FullName)"
              }
            }
          }

          $sbomPayloadDirectory = Join-Path $env:CARGO_TARGET_DIR "release\sbom-payload"
          if (Test-Path -LiteralPath $sbomPayloadDirectory) {
            Remove-Item -LiteralPath $sbomPayloadDirectory -Recurse -Force
          }
          New-Item -ItemType Directory -Path $sbomPayloadDirectory | Out-Null
          Copy-Item -LiteralPath $msiDirectory -Destination (Join-Path $sbomPayloadDirectory "msi") -Recurse
          Copy-Item -LiteralPath $nsisDirectory -Destination (Join-Path $sbomPayloadDirectory "nsis") -Recurse
          # Syft scans the packaged runtime plus the source lockfiles. Without
          # these manifests the SBOM lists PE payloads but omits both Rust and
          # JavaScript dependency trees.
          $dependencyManifestDirectory = Join-Path $sbomPayloadDirectory "dependency-manifests"
          New-Item -ItemType Directory -Path $dependencyManifestDirectory | Out-Null
          foreach ($dependencyFile in @("Cargo.lock", "Cargo.toml")) {
            Copy-Item -LiteralPath (Join-Path "src-tauri" $dependencyFile) `
              -Destination (Join-Path $dependencyManifestDirectory $dependencyFile)
          }
          foreach ($dependencyFile in @("bun.lock", "package.json")) {
            Copy-Item -LiteralPath $dependencyFile `
              -Destination (Join-Path $dependencyManifestDirectory $dependencyFile)
          }
          if ($env:STORE_CANDIDATE -eq "true") {
            if (-not (Test-Path -LiteralPath $env:WEBVIEW2_PAYLOAD_PATH -PathType Container)) {
              throw "Verified WebView2 payload path not found: $env:WEBVIEW2_PAYLOAD_PATH"
            }
            Copy-Item -LiteralPath $env:WEBVIEW2_PAYLOAD_PATH `
              -Destination (Join-Path $sbomPayloadDirectory "webview2") -Recurse
          } else {
            if (-not (Test-Path -LiteralPath $env:PORTABLE_PAYLOAD_PATH -PathType Container)) {
              throw "Verified portable WebView2 payload path not found: $env:PORTABLE_PAYLOAD_PATH"
            }
            Copy-Item -LiteralPath $env:PORTABLE_PAYLOAD_PATH `
              -Destination (Join-Path $sbomPayloadDirectory "portable-webview2") -Recurse
          }
          "path=$sbomPayloadDirectory" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          $uninstallProcess = Start-Process -FilePath $nsisUninstaller `
            -ArgumentList "/S" -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) {
            throw "NSIS uninstaller failed with exit code $($uninstallProcess.ExitCode)"
          }

      - name: Resolve SBOM path
        id: sbom-path
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $directory = Join-Path $env:CARGO_TARGET_DIR "release"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $path = Join-Path $directory "AudioBud_$($env:APP_VERSION)_sbom.spdx.json"
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ steps.packaged-payload.outputs.path }}
          format: spdx-json
          output-file: ${{ steps.sbom-path.outputs.path }}
          syft-version: v1.49.0
          upload-artifact: false
          upload-release-assets: false

      # Publish installer digests as a release asset so the website can link to one
      # stable URL instead of carrying hashes in its markup, which go stale the
      # moment the next release ships and then tell a user with a good file
      # that it is bad. Computed from the signed installers after every
      # signature check has passed, so it describes the files users verify.
      - name: Write SHA256SUMS
        id: checksums
        shell: pwsh
        env:
          NSIS_PATH: ${{ steps.signing-paths.outputs.nsis }}
          MSI_PATH: ${{ steps.signing-paths.outputs.msi }}
          PORTABLE_PATH: ${{ steps.portable-webview-path.outputs.path }}
        run: |
          $checksumPath = Join-Path $env:CARGO_TARGET_DIR "release\SHA256SUMS.txt"
          $artifactPaths = @($env:NSIS_PATH, $env:MSI_PATH)
          if ($env:PORTABLE_PATH) {
            $artifactPaths += $env:PORTABLE_PATH
          }
          $lines = foreach ($path in $artifactPaths) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Cannot checksum a missing release artifact: $path"
            }
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($path))"
          }

          # Two spaces between hash and name, LF endings, no BOM: the format
          # sha256sum -c reads. Out-File would write CRLF and PowerShell's
          # default UTF-8 carries a BOM, and either one breaks that check.
          $content = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText(
            $checksumPath, $content, [System.Text.UTF8Encoding]::new($false))

          "path=$checksumPath" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-Content -LiteralPath $checksumPath

      # Bind every uploaded file to this workflow run and commit. Keep this
      # unconditional so both release assets and CI artifacts can be verified
      # with `gh attestation verify <file> --repo jamditis/audiobud
      # --signer-workflow jamditis/audiobud/.github/workflows/release.yml`.
      # A failed attestation blocks both upload paths below.
      - name: Attest release provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            ${{ steps.signing-paths.outputs.nsis }}
            ${{ steps.signing-paths.outputs.msi }}
            ${{ steps.updater-paths.outputs.archive }}
            ${{ steps.updater-paths.outputs.signature }}
            ${{ steps.updater-paths.outputs.public_key }}
            ${{ steps.portable-webview-path.outputs.path }}
            ${{ steps.sbom-path.outputs.path }}
            ${{ steps.checksums.outputs.path }}

      - name: Attest release SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            ${{ steps.signing-paths.outputs.nsis }}
            ${{ steps.signing-paths.outputs.msi }}
            ${{ steps.updater-paths.outputs.archive }}
            ${{ steps.portable-webview-path.outputs.path }}
          sbom-path: ${{ steps.sbom-path.outputs.path }}

      # A draft is created only after all signatures pass. Reruns reuse the
      # draft, but they refuse to replace assets on a published release.
      - name: Find or create draft release
        if: ${{ env.STORE_CANDIDATE != 'true' && ((github.event_name == 'workflow_dispatch' && inputs.make_release) || github.ref_type == 'tag') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          $tagCommit = git rev-list -n 1 "refs/tags/$env:RELEASE_TAG" 2>$null
          $tagExists = $LASTEXITCODE -eq 0
          if ($tagExists -and $tagCommit -ne $env:GITHUB_SHA) {
            throw "Release tag $env:RELEASE_TAG must match workflow commit $env:GITHUB_SHA; found $tagCommit"
          }

          $releaseJson = gh release view $env:RELEASE_TAG `
            --json isDraft,targetCommitish 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw "Release $env:RELEASE_TAG is already published"
            }
            if (-not $tagExists -and $release.targetCommitish -ne $env:GITHUB_SHA) {
              throw "Draft $env:RELEASE_TAG must match workflow commit $env:GITHUB_SHA; found $($release.targetCommitish)"
            }
            Write-Output "Reusing draft release $env:RELEASE_TAG"
          } else {
            gh release create $env:RELEASE_TAG `
              --draft `
              --generate-notes `
              --target $env:GITHUB_SHA `
              --title "AudioBud $env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create draft release $env:RELEASE_TAG"
            }
          }

      - name: Upload release artifacts to GitHub release
        if: ${{ env.STORE_CANDIDATE != 'true' && ((github.event_name == 'workflow_dispatch' && inputs.make_release) || github.ref_type == 'tag') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          NSIS_PATH: ${{ steps.signing-paths.outputs.nsis }}
          MSI_PATH: ${{ steps.signing-paths.outputs.msi }}
          SBOM_PATH: ${{ steps.sbom-path.outputs.path }}
          CHECKSUM_PATH: ${{ steps.checksums.outputs.path }}
          UPDATER_ARCHIVE: ${{ steps.updater-paths.outputs.archive }}
          UPDATER_SIGNATURE: ${{ steps.updater-paths.outputs.signature }}
          UPDATER_PUBLIC_KEY: ${{ steps.updater-paths.outputs.public_key }}
          PORTABLE_PATH: ${{ steps.portable-webview-path.outputs.path }}
        run: |
          gh release upload $env:RELEASE_TAG `
            $env:NSIS_PATH $env:MSI_PATH $env:UPDATER_ARCHIVE `
            $env:UPDATER_SIGNATURE $env:UPDATER_PUBLIC_KEY `
            $env:PORTABLE_PATH $env:SBOM_PATH `
            $env:CHECKSUM_PATH --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload release artifacts to $env:RELEASE_TAG"
          }

      - name: Upload release artifacts as CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audiobud-windows-x86_64${{ steps.package-flavor.outputs.artifact_suffix }}-v${{ steps.meta.outputs.version }}-${{ github.run_attempt }}
          path: |
            ${{ steps.signing-paths.outputs.nsis }}
            ${{ steps.signing-paths.outputs.msi }}
            ${{ steps.updater-paths.outputs.archive }}
            ${{ steps.updater-paths.outputs.signature }}
            ${{ steps.updater-paths.outputs.public_key }}
            ${{ steps.portable-webview-path.outputs.path }}
            ${{ steps.sbom-path.outputs.path }}
            ${{ steps.checksums.outputs.path }}
          retention-days: 30
          if-no-files-found: error
