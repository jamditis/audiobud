name: Verify lazy settings sections

on:
  push:
    branches: [perf/lazy-load-settings-sections]

permissions:
  contents: write

jobs:
  verify-change:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/lazy-load-settings-sections

      - name: Add the section loading state
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("src/App.tsx")
          app = app_path.read_text(encoding="utf-8")

          old_react = 'import { useEffect, useState, useRef } from "react";\n'
          new_react = 'import { Suspense, useEffect, useRef, useState } from "react";\n'
          if app.count(old_react) != 1:
              raise SystemExit("The React import is not unique")
          app = app.replace(old_react, new_react, 1)

          platform_import = 'import { platform } from "@tauri-apps/plugin-os";\n'
          if app.count(platform_import) != 1:
              raise SystemExit("The platform import is not unique")
          app = app.replace(
              platform_import,
              platform_import + 'import { Loader2 } from "lucide-react";\n',
              1,
          )

          old_content = '''              <AccessibilityPermissions />
                        {renderSettingsContent(currentSection, setCurrentSection)}
          '''
          new_content = '''              <AccessibilityPermissions />
                        <Suspense
                          fallback={
                            <div
                              className="flex min-h-48 w-full items-center justify-center"
                              role="status"
                              aria-live="polite"
                              aria-busy="true"
                            >
                              <Loader2
                                className="h-6 w-6 animate-spin text-text/50"
                                aria-hidden="true"
                              />
                              <span className="sr-only">
                                {t("modelSelector.loadingGeneric")}
                              </span>
                            </div>
                          }
                        >
                          {renderSettingsContent(
                            currentSection,
                            setCurrentSection,
                          )}
                        </Suspense>
          '''
          if app.count(old_content) != 1:
              raise SystemExit("The settings content block is not unique")
          app = app.replace(old_content, new_content, 1)
          app_path.write_text(app, encoding="utf-8")

          index_path = Path("src/components/settings/index.ts")
          index = index_path.read_text(encoding="utf-8")
          marker = "// Individual setting components\n"
          if index.count(marker) != 1:
              raise SystemExit("The individual settings marker is not unique")
          index_path.write_text(index[index.index(marker):], encoding="utf-8")
          PY

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and verify the frontend
        run: |
          bunx prettier --write \
            src/App.tsx \
            src/components/Sidebar.tsx \
            src/components/settings/index.ts
          bun run lint
          bunx tsc --noEmit
          bun run test
          bun run report:size

      - name: Commit the verified change
        run: |
          git rm .github/workflows/one-shot-lazy-settings-sections.yml
          git add \
            src/App.tsx \
            src/components/Sidebar.tsx \
            src/components/settings/index.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Load settings sections when they open"
          git push origin HEAD:perf/lazy-load-settings-sections
