name: Size report

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-size:
    name: Frontend size report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and measure frontend files
        run: bun run report:size

      - name: Add the report to the job summary
        run: cat artifacts/size-report/size-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the size report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-size-report
          path: artifacts/size-report/
          if-no-files-found: error
          retention-days: 30
