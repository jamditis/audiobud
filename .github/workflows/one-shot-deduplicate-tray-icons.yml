name: Deduplicate tray icons

on:
  push:
    branches: [perf/deduplicate-tray-icons]

permissions:
  contents: write

jobs:
  build-change:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/deduplicate-tray-icons

      - name: Use one icon per theme
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/tray.rs")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '(AppTheme::Dark, TrayIconState::Recording) => "resources/tray_recording.png",':
                  '(AppTheme::Dark, TrayIconState::Recording) => "resources/tray_idle.png",',
              '(AppTheme::Dark, TrayIconState::Transcribing) => "resources/tray_transcribing.png",':
                  '(AppTheme::Dark, TrayIconState::Transcribing) => "resources/tray_idle.png",',
              '(AppTheme::Light, TrayIconState::Recording) => "resources/tray_recording_dark.png",':
                  '(AppTheme::Light, TrayIconState::Recording) => "resources/tray_idle_dark.png",',
              '(AppTheme::Light, TrayIconState::Transcribing) => "resources/tray_transcribing_dark.png",':
                  '(AppTheme::Light, TrayIconState::Transcribing) => "resources/tray_idle_dark.png",',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Tray icon mapping is not unique: {old}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          git rm \
            src-tauri/resources/tray_recording.png \
            src-tauri/resources/tray_transcribing.png \
            src-tauri/resources/tray_recording_dark.png \
            src-tauri/resources/tray_transcribing_dark.png

      - name: Install Linux build dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Acquire::Retries=3 libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libssl-dev libgtk-layer-shell-dev

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Use the CI transcription adapter
        working-directory: src-tauri
        run: |
          cp src/managers/transcription_mock.rs src/managers/transcription.rs
          sed -i '/^transcribe-rs/d' Cargo.toml

      - name: Format and test the tray code
        working-directory: src-tauri
        run: |
          cargo fmt
          cargo test tray::tests --lib

      - name: Commit the verified change
        run: |
          git checkout -- src-tauri/Cargo.toml src-tauri/src/managers/transcription.rs
          git rm .github/workflows/one-shot-deduplicate-tray-icons.yml
          git add src-tauri/src/tray.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove duplicate tray icon files"
          git push origin HEAD:perf/deduplicate-tray-icons
