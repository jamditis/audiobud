name: Linux retirement source audit

on:
  push:
    branches: [work/linux-retirement-20260915]
    paths:
      - .github/workflows/linux-retirement-work.yml
      - scripts/linux-retirement-work.py

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'jamditis/audiobud' && github.ref == 'refs/heads/work/linux-retirement-20260915'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install source parser
        run: |
          python3 -m venv /tmp/retirement-parser
          /tmp/retirement-parser/bin/pip install tree-sitter==0.25.0 tree-sitter-rust==0.24.0
      - name: Inspect source structure and current documentation
        shell: bash
        run: |
          /tmp/retirement-parser/bin/python - <<'PY'
          from pathlib import Path
          from tree_sitter import Language, Parser
          import tree_sitter_rust
          import re
          parser = Parser(Language(tree_sitter_rust.language()))
          for path in sorted(Path('src-tauri/src').rglob('*.rs')):
              source = path.read_bytes()
              root = parser.parse(source).root_node
              def visit(node):
                  if node.type == 'attribute_item' and b'linux' in node.text:
                      nxt = node.next_named_sibling
                      prev = node.prev_named_sibling
                      print(f'{path}:{node.start_point.row+1} {node.text.decode()} parent={node.parent.type} next={nxt.type if nxt else None} prev={prev.type if prev else None}')
                  for child in node.named_children:
                      visit(child)
              visit(root)
          for name in ['src/hooks/usePreflight.ts', 'src/lib/preflight-facts.ts', 'src/components/settings/history/HistorySettings.tsx', 'src-tauri/resources/default_settings.json', 'src/lib/paste-methods.ts', 'src/lib/paste-methods.test.ts']:
              path = Path(name)
              if path.exists():
                  print(f'\n=== FULL {name} ===\n{path.read_text()}')
          for name in ['README.md', 'SYSTEM_REQUIREMENTS.md', 'BUILD.md', 'AGENTS.md', 'CONTRIBUTING.md', 'RELEASE_NOTES.md', 'CHANGELOG.md', 'docs/roadmap.html', 'superpowers/DEFERRED-issues.md']:
              path = Path(name)
              lines = path.read_text().splitlines()
              if name == 'CHANGELOG.md':
                  lines = lines[:160]
              print(f'\n=== {name} ===')
              hits = [i for i,line in enumerate(lines) if re.search('linux|nix|platform', line, re.I)]
              indices = sorted({j for i in hits for j in range(max(0,i-3),min(len(lines),i+7))})
              for i in indices:
                  print(f'{i+1:04d}: {lines[i]}')
          for path in [Path('scripts/check-translations.ts'), *Path('src/i18n/locales').glob('en/translation.json')]:
              lines = path.read_text().splitlines()
              print(f'\n=== LOCALE {path} ===')
              hits=[i for i,line in enumerate(lines) if re.search('linux|typingTool|allowlist|exception',line,re.I)]
              for i in sorted({j for i in hits for j in range(max(0,i-2),min(len(lines),i+7))}):
                  print(f'{i+1:04d}: {lines[i]}')
          print('\n=== macOS environment ===')
          print('\n'.join(Path('.github/workflows/release.yml').read_text().splitlines()[1818:1867]))
          PY
