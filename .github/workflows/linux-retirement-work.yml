name: Linux retirement follow-up

on:
  push:
    branches: [work/linux-retirement-20260915]
    paths: [.github/workflows/linux-retirement-work.yml]

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'jamditis/audiobud' && github.ref == 'refs/heads/work/linux-retirement-20260915'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 070ab7fa27d7fd18dc844b6d24cbc587810f22cf
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Remove the obsolete Linux overlay warning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          path = Path('src/i18n/locales/lt/translation.json')
          source = path.read_text()
          data = json.loads(source)
          old = data['settings']['advanced']['overlay']['description']
          assert 'Linux' in old
          new = 'Rodyti vaizdinį indikatorių įrašymo ir transkripcijos metu.'
          assert old.startswith(new)
          assert source.count(json.dumps(old, ensure_ascii=False)) == 1
          path.write_text(source.replace(json.dumps(old, ensure_ascii=False), json.dumps(new, ensure_ascii=False)))
          PY
      - name: Validate translation and formatting
        run: |
          bun install --frozen-lockfile
          bun run check:translations
          bunx --no-install prettier --check src/i18n/locales/lt/translation.json
          bun run test
          git diff --check
          git diff -- src/i18n/locales/lt/translation.json
          git diff --binary > /tmp/linux-retirement-follow-up.patch
      - uses: actions/upload-artifact@v4
        with:
          name: linux-retirement-follow-up
          path: /tmp/linux-retirement-follow-up.patch
          retention-days: 3
          if-no-files-found: error

  record-commit:
    needs: check
    if: github.repository == 'jamditis/audiobud' && github.ref == 'refs/heads/work/linux-retirement-20260915'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 070ab7fa27d7fd18dc844b6d24cbc587810f22cf
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: linux-retirement-follow-up
          path: /tmp/retirement-follow-up
      - name: Record a commit object without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git apply --index --check /tmp/retirement-follow-up/linux-retirement-follow-up.patch
          git apply --index /tmp/retirement-follow-up/linux-retirement-follow-up.patch
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          base = '070ab7fa27d7fd18dc844b6d24cbc587810f22cf'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == base
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert changed == ['src/i18n/locales/lt/translation.json'], changed
          def api(endpoint, body):
              response = subprocess.check_output(['gh', 'api', '--method', 'POST', f'repos/jamditis/audiobud/git/{endpoint}', '--input', '-'], input=json.dumps(body), text=True)
              return json.loads(response)
          tree = api('trees', {'base_tree': '984c98ef2586efc5182552f321e3eb9f4f71e649', 'tree': [{'path': changed[0], 'mode': '100644', 'type': 'blob', 'content': Path(changed[0]).read_text()}]})
          commit = api('commits', {'message': 'fix: remove retired Linux overlay advice from the Lithuanian translation', 'tree': tree['sha'], 'parents': [base]})
          print('VALIDATED_REVIEW_COMMIT=' + commit['sha'])
          print('No branch, tag, release, or default-branch change was performed.')
          PY
