name: Publish update feed

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published stable release tag to validate and republish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-update-feed
  cancel-in-progress: false

jobs:
  publish:
    name: Publish signed latest.json
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Resolve published release
        id: release
        shell: bash
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [[ -z "$TAG" ]]; then
            echo "::error::A release tag is required"
            exit 1
          fi

          RELEASE_JSON="$RUNNER_TEMP/release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RELEASE_JSON"
          if jq -e '.draft or .prerelease or (.published_at == null)' "$RELEASE_JSON" > /dev/null; then
            echo "::error::Update feeds require a published, stable release"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "json=$RELEASE_JSON" >> "$GITHUB_OUTPUT"

      - name: Download signed updater assets
        id: updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          ASSET_DIRECTORY="$RUNNER_TEMP/update-assets"
          mkdir -p "$ASSET_DIRECTORY"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$ASSET_DIRECTORY" \
            --pattern "*.nsis.zip" \
            --pattern "*.nsis.zip.sig"

          mapfile -t ARCHIVES < <(find "$ASSET_DIRECTORY" -maxdepth 1 -type f -name '*.nsis.zip')
          mapfile -t SIGNATURES < <(find "$ASSET_DIRECTORY" -maxdepth 1 -type f -name '*.nsis.zip.sig')
          if [[ ${#ARCHIVES[@]} -ne 1 || ${#SIGNATURES[@]} -ne 1 ]]; then
            echo "::error::Expected one updater archive and one signature"
            exit 1
          fi
          if [[ "${SIGNATURES[0]}" != "${ARCHIVES[0]}.sig" ]]; then
            echo "::error::Updater archive and signature names do not match"
            exit 1
          fi

          echo "signature=${SIGNATURES[0]}" >> "$GITHUB_OUTPUT"

      - name: Generate latest.json
        id: manifest
        shell: bash
        env:
          RELEASE_JSON: ${{ steps.release.outputs.json }}
          SIGNATURE: ${{ steps.updater.outputs.signature }}
        run: |
          set -euo pipefail
          MANIFEST="$RUNNER_TEMP/latest.json"
          bun scripts/generate-update-manifest.ts \
            --release "$RELEASE_JSON" \
            --repository "$GITHUB_REPOSITORY" \
            --signature "$SIGNATURE" \
            --output "$MANIFEST"
          jq -e . "$MANIFEST" > /dev/null
          echo "path=$MANIFEST" >> "$GITHUB_OUTPUT"

      - name: Upload latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          MANIFEST: ${{ steps.manifest.outputs.path }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$MANIFEST" --clobber --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -Fx latest.json
